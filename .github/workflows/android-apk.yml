name: Android APK

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk LiveRooms.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveRooms-Android
          path: LiveRooms.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp LiveRooms.apk public/LiveRooms.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/LiveRooms.apk
          git diff --cached --quiet || git commit -m "Update Android APK"
          git push
