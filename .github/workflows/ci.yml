name: CI

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'codex/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install mobile browser test runtime
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify mobile chat flows
        run: node scripts/ui-smoke.mjs

  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t live-rooms-ci .
      - name: Verify production startup
        run: |
          docker run -d --name live-rooms-ci -p 3000:3000 live-rooms-ci
          trap 'docker logs live-rooms-ci; docker rm -f live-rooms-ci' EXIT
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors --retry-connrefused --max-time 5 http://127.0.0.1:3000/api/health
