plugins {
    id 'com.android.application'
}
dependencies { implementation 'androidx.core:core:1.15.0'; implementation('io.socket:socket.io-client:2.1.1') { exclude group: 'org.json', module: 'json' } }

android {
    namespace 'com.raunak.liverooms'
    compileSdk 35

    defaultConfig {
        applicationId 'com.raunak.liverooms'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
